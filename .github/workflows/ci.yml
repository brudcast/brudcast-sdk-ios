name: CI

on:
  push:
    branches: [main, develop]

  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Run the logic tests
        run: swift test

      - name: Build for iOS
        run: xcodebuild -scheme Brudcast-Package -destination 'generic/platform=iOS Simulator' build

      - name: Check the sample project matches project.yml
        working-directory: Examples/BrudcastSample
        run: |
          curl -sSfL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- . || (echo "Run xcodegen generate in Examples/BrudcastSample and commit the result" && exit 1)

      - name: Build the sample app
        run: xcodebuild -project Examples/BrudcastSample/BrudcastSample.xcodeproj -scheme BrudcastSample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  podspecs:
    name: Lint the podspecs
    runs-on: macos-15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Lint the pods without dependencies
        run: |
          pod lib lint Brudcast.podspec --platforms=ios --skip-tests
          pod lib lint BrudcastNotificationService.podspec --platforms=ios --skip-tests

      - name: Lint the pods that depend on them
        run: |
          pod lib lint BrudcastInApp.podspec --platforms=ios --skip-tests --include-podspecs='{Brudcast,BrudcastNotificationService}.podspec'
          pod lib lint BrudcastPush.podspec --platforms=ios --skip-tests --include-podspecs='{Brudcast,BrudcastNotificationService}.podspec'
