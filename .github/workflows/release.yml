name: Release

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/.*version = "\(.*\)".*/\1/p' Sources/Brudcast/Internal/BrudcastSDK.swift)" >> "$GITHUB_OUTPUT"

      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match BrudcastSDK.version $VERSION"
            exit 1
          fi

      - name: Check the changelog and README name the same version
        run: scripts/check-version.sh

      - name: Check the repository is public before a release
        if: github.event_name == 'release' && github.event.repository.private
        run: |
          echo "::error::Make the repository public before releasing. Swift Package Manager fetches the sources from it."
          exit 1

  test:
    name: Test
    needs: verify
    runs-on: macos-15

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Run the logic tests
        run: swift test

      - name: Build for iOS
        run: xcodebuild -scheme Brudcast-Package -destination 'generic/platform=iOS Simulator' build

  spm:
    name: Build with Swift Package Manager
    needs: [verify, test]
    runs-on: macos-15

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build an app package that depends on the release tag
        if: github.event_name == 'release'
        run: scripts/check-spm-consumer.sh --version "${{ needs.verify.outputs.version }}"

      - name: Build an app package that depends on this commit
        if: github.event_name != 'release'
        run: scripts/check-spm-consumer.sh --revision "$GITHUB_SHA"

      - name: Summarise the check
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            if [ "$EVENT" = "release" ]; then
              echo "### Swift Package Manager builds $VERSION"
              echo
              echo "An app package depending on \`exact: \"$VERSION\"\` resolved it from GitHub and built all four products for iOS."
            else
              echo "### Swift Package Manager builds ${GITHUB_SHA:0:7}"
              echo
              echo "An app package depending on this commit resolved it from GitHub and built all four products for iOS."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
