# XcodeGen spec for the sample app. Edit this, not the .xcodeproj, then run `xcodegen generate`
# in this folder.

name: BrudcastSample

options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

configFiles:
  Debug: Config/Sample.xcconfig
  Release: Config/Sample.xcconfig

packages:
  Brudcast:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  BrudcastSample:
    type: application
    platform: iOS
    sources:
      - path: BrudcastSample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAMPLE_BUNDLE_ID)
        INFOPLIST_FILE: BrudcastSample/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrudcastSample/BrudcastSample.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Brudcast Sample
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: Brudcast
        products:
          - Brudcast
          - BrudcastInApp
          - BrudcastPush
      - target: NotificationService

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAMPLE_BUNDLE_ID).NotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: NotificationService
    dependencies:
      - package: Brudcast
        product: BrudcastNotificationService

  BrudcastSampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrudcastSampleUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAMPLE_BUNDLE_ID).UITests
    dependencies:
      - target: BrudcastSample

schemes:
  BrudcastSample:
    build:
      targets:
        BrudcastSample: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrudcastSampleUITests
    archive:
      config: Release
